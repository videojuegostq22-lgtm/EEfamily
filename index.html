<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0F19" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Family Finance — Nuestra economía familiar</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%236366F1'/><text x='50%' y='58%' text-anchor='middle' font-family='system-ui' font-size='40' fill='white' font-weight='700'>FF</text></svg>" />
<style>
:root{--bg:#F3F5FA;--surface:#FFFFFF;--surface-2:#F7F9FC;--surface-3:#EEF1F7;--border:#E4E8F0;--border-strong:#CBD1DC;--text:#0F172A;--text-2:#475569;--text-3:#94A3B8;--brand:#6366F1;--brand-2:#818CF8;--brand-soft:#EEF2FF;--brand-text:#3730A3;--pos:#16A34A;--pos-soft:#DCFCE7;--pos-text:#14532D;--neg:#DC2626;--neg-soft:#FEE2E2;--neg-text:#7F1D1D;--warn:#F59E0B;--warn-soft:#FEF3C7;--warn-text:#92400E;--shadow-sm:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.04);--shadow:0 6px 16px rgba(15,23,42,.06),0 2px 6px rgba(15,23,42,.04);--shadow-lg:0 20px 40px rgba(15,23,42,.12),0 4px 12px rgba(15,23,42,.06);--radius-sm:10px;--radius:16px;--radius-lg:22px;--radius-xl:28px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif}
html.dark{--bg:#0B0F19;--surface:#141A2A;--surface-2:#181F32;--surface-3:#0F1422;--border:#242B3F;--border-strong:#334155;--text:#F1F5F9;--text-2:#94A3B8;--text-3:#64748B;--brand:#818CF8;--brand-2:#A5B4FC;--brand-soft:rgba(129,140,248,.14);--brand-text:#C7D2FE;--pos:#22C55E;--pos-soft:rgba(34,197,94,.14);--pos-text:#86EFAC;--neg:#F87171;--neg-soft:rgba(248,113,113,.14);--neg-text:#FCA5A5;--warn:#FBBF24;--warn-soft:rgba(251,191,36,.14);--warn-text:#FDE68A;--shadow-sm:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.2);--shadow:0 8px 20px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.2);--shadow-lg:0 24px 48px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;max-width:100%}
html{overflow-x:hidden;max-width:100vw;scroll-behavior:smooth}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;letter-spacing:-.01em;min-height:100vh;overflow-x:hidden;max-width:100vw}
body{min-height:100dvh;overflow-x:hidden;word-break:break-word;overflow-wrap:break-word;text-size-adjust:100%;-webkit-text-size-adjust:100%}
img,svg,video,canvas,iframe{max-width:100%;height:auto}
svg{overflow:visible}
table{border-collapse:collapse;width:100%;max-width:100%}
pre,code{white-space:pre-wrap;word-wrap:break-word;max-width:100%}
a{color:var(--brand);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:100vw;overflow-x:hidden}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100dvh;max-width:100vw;overflow-x:hidden}
@media(max-width:920px){.shell{grid-template-columns:1fr}}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:22px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;overflow:auto}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:grid;place-items:center;color:white;font-weight:800;font-size:15px;box-shadow:var(--shadow-sm)}
.space-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2);margin-bottom:14px;border:1px solid var(--border)}
.space-pill .avatars{display:flex}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:white;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--surface)}
.avatar+.avatar{margin-left:-10px}
.space-pill .meta{font-size:12.5px;line-height:1.2}
.space-pill .meta b{font-size:13px;display:block;color:var(--text)}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text-2);font-weight:500;font-size:14.5px;transition:all .15s;text-decoration:none;cursor:pointer}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-text)}
html.dark .nav-item.active{color:#E0E7FF}
.nav-item svg{width:20px;height:20px;flex:0 0 20px}
.nav-sep{height:1px;background:var(--border);margin:10px 6px}
.sidebar-footer{margin-top:auto;padding:10px 8px;font-size:13px;color:var(--text-3);display:flex;gap:8px;flex-wrap:wrap}
.sidebar-footer button{padding:6px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;color:var(--text-2);font-weight:500}
.sidebar-footer button:hover{color:var(--text);border-color:var(--border-strong)}
.main{padding:20px 28px 120px;max-width:1400px;width:100%;box-sizing:border-box;overflow-x:hidden}
@media(max-width:920px){.main{padding:16px 14px 140px}}
@media(max-width:380px){.main{padding:14px 10px 140px}}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.topbar .period{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;gap:2px;overflow-x:auto;flex:0 0 auto;max-width:100%;min-width:0}
.period button{padding:7px 12px;border-radius:10px;font-size:13px;color:var(--text-2);font-weight:500;white-space:nowrap;transition:all .15s}
@media(max-width:380px){.topbar h1{font-size:20px}.period button{padding:6px 10px;font-size:12px}}
.period button.active{background:var(--brand);color:white}
.period button:hover:not(.active){background:var(--surface-2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
.card h3,.card h4{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.metric-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
@media(max-width:1100px){.metric-row{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
@media(max-width:700px){.metric-row{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
@media(max-width:500px){.metric-row{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.metric-row{grid-template-columns:1fr 1fr;gap:10px}}
.metric.hero{background:linear-gradient(135deg,var(--pos-soft),var(--surface));border-color:var(--pos)}
.metric.hero.neg{background:linear-gradient(135deg,var(--neg-soft),var(--surface));border-color:var(--neg)}
.metric-row.full-width{grid-template-columns:1fr !important;margin-top:-8px;margin-bottom:16px}
.metric-row.full-width .metric{background:linear-gradient(135deg,var(--brand-soft),var(--surface));border-color:rgba(99,102,241,.2)}
.metric-row.full-width .metric.neg{background:linear-gradient(135deg,var(--neg-soft),var(--surface));border-color:rgba(220,38,38,.2)}
.info-hint{font-size:12.5px;color:var(--text-3);background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:10px 14px;margin:-8px 0 16px;line-height:1.5}
.info-hint b{color:var(--text)}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);min-width:0}
.metric .label{font-size:12.5px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.metric .value{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;word-break:break-word}
@media(max-width:1100px){.metric .value{font-size:24px}}
@media(max-width:500px){.metric .value{font-size:22px}}
@media(max-width:380px){.metric{padding:14px 14px}.metric .value{font-size:20px}.metric .label{font-size:11px}}
.metric .sub{font-size:12.5px;color:var(--text-2);margin-top:2px}
.metric.pos .value{color:var(--pos)}
.metric.neg .value{color:var(--neg)}
.metric.brand .value{color:var(--brand)}
.charts-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:20px}
.chart{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.chart h3{margin:0 0 14px;font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.c-4{grid-column:span 4}.c-6{grid-column:span 6}.c-8{grid-column:span 8}.c-12{grid-column:span 12}
@media(max-width:920px){.c-4,.c-6,.c-8{grid-column:span 12}}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;font-size:12px;color:var(--text-2)}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.health-card{background:linear-gradient(135deg,var(--brand-soft),var(--surface));border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.health-main{display:flex;align-items:center;gap:28px;flex-wrap:wrap;min-width:0}
.health-ring{position:relative;width:160px;height:160px;flex:0 0 auto}
@media(max-width:420px){.health-ring{width:130px;height:130px}.health-main{gap:18px}}
@media(max-width:380px){.health-ring{width:110px;height:110px}.health-main{gap:14px}.health-card{padding:18px}}
.health-ring svg{width:100%;height:100%}
.health-ring .score{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.health-ring .score b{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--text)}
.health-ring .score span{display:block;font-size:12px;color:var(--text-2);margin-top:-4px}
@media(max-width:420px){.health-ring .score b{font-size:34px}}
@media(max-width:380px){.health-ring .score b{font-size:28px}.health-ring .score span{font-size:10px}}
.health-body h2{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.health-body p{margin:0 0 12px;color:var(--text-2);font-size:14px}
.health-parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px}
@media(max-width:380px){.health-parts{grid-template-columns:1fr 1fr}}
.health-part{padding:8px 12px;background:var(--surface-2);border-radius:10px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;min-width:0}
.health-part b{font-variant-numeric:tabular-nums;color:var(--brand-text)}
.health-bar{height:4px;background:var(--surface-3);border-radius:4px;margin-top:6px;overflow:hidden}
.health-bar>div{height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
.row-list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;transition:background .15s;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row .icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 40px;font-size:18px}
.row .icon.tx-income{background:var(--pos-soft);color:var(--pos-text)}
.row .icon.tx-expense{background:var(--neg-soft);color:var(--neg-text)}
.row .icon.tx-transfer{background:var(--brand-soft);color:var(--brand-text)}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .info span{font-size:12.5px;color:var(--text-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amount{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14.5px}
.row .amount.pos{color:var(--pos)}
.row .amount.neg{color:var(--neg)}
.row .who{font-size:11px;color:var(--text-3);margin-top:2px}
.progress{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.progress.warn>div{background:var(--warn)}
.progress.danger>div{background:var(--neg)}
.progress.pos>div{background:var(--pos)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:all .15s;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:white}
.btn-primary:hover{background:var(--brand-2)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn-soft{background:var(--brand-soft);color:var(--brand-text)}
.btn-danger{background:var(--neg-soft);color:var(--neg-text);border-color:transparent}
.btn-danger:hover{background:var(--neg);color:white}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}
.fab{position:fixed;bottom:22px;right:22px;width:60px;height:60px;border-radius:50%;background:var(--brand);color:white;box-shadow:var(--shadow-lg);display:grid;place-items:center;z-index:40;cursor:pointer;transition:all .15s}
.fab:hover{transform:scale(1.05)}
.fab:active{transform:scale(.95)}
.fab svg{width:26px;height:26px}
.fab-menu{position:fixed;bottom:92px;right:22px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:6px;box-shadow:var(--shadow-lg);z-index:40;min-width:180px;display:none;flex-direction:column;gap:2px}
.fab-menu.open{display:flex}
.fab-menu button{padding:10px 14px;text-align:left;border-radius:10px;font-size:14px;color:var(--text);display:flex;align-items:center;gap:10px}
.fab-menu button:hover{background:var(--surface-2)}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:30;backdrop-filter:blur(12px)}
.bnav-inner{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 6px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--text-3);font-size:10.5px;font-weight:500;border-radius:8px;min-width:0}
@media(max-width:380px){.bnav button{font-size:9.5px;padding:5px 1px}.bnav button svg{width:20px;height:20px}}
.bnav button.active{color:var(--brand)}
.bnav button svg{width:22px;height:22px}
@media(max-width:920px){
  .sidebar{display:none}
  .bnav{display:block}
  .fab{
    bottom:calc(78px + env(safe-area-inset-bottom));
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:56px;
    height:56px;
    box-shadow:0 8px 24px rgba(99,102,241,.4),0 4px 12px rgba(99,102,241,.25);
  }
  .fab:hover,.fab:active{transform:translateX(-50%) scale(1.08)}
  .fab-menu{
    bottom:calc(144px + env(safe-area-inset-bottom));
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }
  .topbar h1{font-size:22px}
  .metric .value{font-size:24px}
}
.bnav-sheet{display:none;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.bnav-sheet.open{display:flex;align-items:flex-end;justify-content:center}
.bnav-sheet .sheet{background:var(--surface);border-top-left-radius:24px;border-top-right-radius:24px;width:100%;max-width:560px;padding:20px 20px 28px;max-height:70vh;overflow:auto;animation:slideUp .2s ease}
.bnav-sheet .sheet h3{margin:0 0 16px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.bnav-sheet .sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.bnav-sheet .sheet-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:16px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;transition:all .15s;text-align:center}
.bnav-sheet .sheet-item:hover{background:var(--brand-soft);border-color:var(--brand);transform:translateY(-2px)}
.bnav-sheet .sheet-item:active{transform:scale(.96)}
.bnav-sheet .sheet-item svg{width:28px;height:28px;color:var(--text-2)}
.bnav-sheet .sheet-item b{font-size:12px;font-weight:600;color:var(--text);line-height:1.2}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.bnav-sheet .sheet .grip{width:40px;height:4px;background:var(--border-strong);border-radius:4px;margin:0 auto 16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.input,.select,.textarea{width:100%;padding:11px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;font-size:14.5px;color:var(--text);transition:all .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft)}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%2394A3B8' d='M1 1l5 5 5-5' stroke='none'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
.textarea{resize:vertical;min-height:80px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--border-strong)}
.chip.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-text)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0}
html.dark .modal-backdrop{background:rgba(0,0,0,.7)}
.modal-backdrop.open{display:flex;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-top-left-radius:24px;border-top-right-radius:24px;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:20px 20px 28px;animation:slideUp .2s ease}
@media(min-width:700px){.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:24px;max-height:85vh}}
.modal .grip{width:44px;height:4px;background:var(--border-strong);border-radius:4px;margin:0 auto 14px}
.modal h2{margin:4px 0 18px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px;max-width:100%;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;flex:1}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
@media(max-width:420px){
  .seg{width:100%}
  .seg button{padding:7px 6px;font-size:11.5px}
}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px}
.cat-grid .chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;font-size:11.5px;text-align:center;min-height:68px;justify-content:center}
.cat-grid .chip .emoji{font-size:22px}
.activity{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border);font-size:13px;color:var(--text-2)}
.activity:last-child{border-bottom:none}
.activity .ava{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 28px}
.activity b{color:var(--text)}
.activity time{color:var(--text-3);font-size:11.5px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-head h3{margin:0;font-size:16px;text-transform:none;letter-spacing:0}
.cal-card{overflow:hidden}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;max-width:100%;min-width:0}
.cal-grid .dn{font-size:11px;color:var(--text-3);font-weight:600;text-align:center;padding:4px 0;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cal-day{aspect-ratio:1;padding:6px;border-radius:10px;background:var(--surface-2);font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:60px;min-width:0;position:relative;border:1px solid transparent;transition:all .15s;overflow:hidden}
.cal-day:hover{border-color:var(--border-strong)}
.cal-day.today{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.cal-day.muted{opacity:.35}
.cal-day .day-num{font-weight:600;font-variant-numeric:tabular-nums;line-height:1;flex:0 0 auto}
.cal-day .events{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.cal-day .events i{width:6px;height:6px;border-radius:50%;display:inline-block;flex:0 0 6px}
.cal-day.selected{border-color:var(--brand);background:var(--brand-soft)}
@media(max-width:600px){
  .cal-grid{gap:3px}
  .cal-day{aspect-ratio:auto;padding:5px 4px;min-height:54px;font-size:12px}
  .cal-grid .dn{font-size:10px;padding:3px 0}
  .cal-day .day-num{font-size:13px}
  .cal-day .events i{width:5px;height:5px;flex:0 0 5px}

}
@media(max-width:420px){
  .cal-grid{gap:2px}
  .cal-day{aspect-ratio:auto;padding:4px 3px;min-height:48px;font-size:11.5px}
  .cal-grid .dn{font-size:9.5px;padding:2px 0;text-transform:none}
  .cal-day .day-num{font-size:12px}
  .cal-day .events i{width:4px;height:4px;flex:0 0 4px}
  .cal-day .events{gap:1.5px}
  .cal-head h3{font-size:14px}
}
@media(max-width:380px){
  .cal-grid{gap:1.5px}
  .cal-day{aspect-ratio:auto;padding:3px 2px;min-height:42px;font-size:11px}
  .cal-grid .dn{font-size:9px}
  .cal-day .day-num{font-size:11px}
  .cal-day .events i{width:3.5px;height:3.5px;flex:0 0 3.5px}
  .cal-head{margin-bottom:10px}
  .cal-head .icon-btn{width:30px;height:30px}
  .cal-head .icon-btn svg{width:16px;height:16px}
  .cal-card{padding:14px 12px}
}
@media(max-width:420px) and (min-width:381px){
  .cal-card{padding:16px 14px}
}
.cal-grid .dn .dn-short{display:none}
@media(max-width:480px){
  .cal-grid .dn .dn-full{display:none}
  .cal-grid .dn .dn-short{display:inline}
}
.cal-events{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.notif{position:fixed;top:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow-lg);z-index:100;max-width:calc(100vw - 40px);animation:slideInR .2s ease;font-size:13.5px}
@keyframes slideInR{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.notif.pos{border-left:3px solid var(--pos)}
.notif.neg{border-left:3px solid var(--neg)}
.notif.warn{border-left:3px solid var(--warn)}
.notif.info{border-left:3px solid var(--brand)}
.ai-card{background:linear-gradient(135deg,#EEF2FF,#E0E7FF);border:1px solid rgba(99,102,241,.2);border-radius:var(--radius-lg);padding:22px;margin-bottom:16px;color:#312E81;position:relative;overflow:hidden}

html.dark .ai-card.ai-card-hero{background:linear-gradient(135deg,rgba(99,102,241,.18) 0%,rgba(129,140,248,.14) 60%,rgba(139,92,246,.10) 100%);border-color:rgba(129,140,248,.35);color:#E0E7FF}
.ai-card.ai-card-hero::before{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.2),transparent 70%);pointer-events:none}
html.dark .ai-card.ai-card-hero::before{background:radial-gradient(circle,rgba(129,140,248,.25),transparent 70%)}
.ai-card.ai-card-hero h3{font-size:18px;margin-bottom:8px}
.ai-card.ai-card-hero p{font-size:14.5px;line-height:1.55;margin-top:4px}
.ai-card h3{margin:0 0 4px;font-size:16px;font-weight:700;color:inherit;text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:8px}
.ai-card .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:rgba(99,102,241,.15);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
html.dark .ai-card .tag{background:rgba(129,140,248,.2)}
.ai-card p{margin:6px 0 0;font-size:14px;line-height:1.5}
.ai-card .why{margin-top:10px;font-size:12.5px;opacity:.85;padding:10px 12px;background:rgba(255,255,255,.4);border-radius:10px;border-left:2px solid currentColor}
html.dark .ai-card .why{background:rgba(255,255,255,.05)}
.ai-card details summary{cursor:pointer;font-size:12.5px;font-weight:600;margin-top:8px;opacity:.9}
.ai-card .impact{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:99px;background:var(--pos-soft);color:var(--pos-text);font-size:11.5px;font-weight:600}
.auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#6366F1 0%,#8B5CF6 50%,#A855F7 100%);position:relative;overflow:hidden}
.auth::before,.auth::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}
.auth::before{width:400px;height:400px;background:#818CF8;top:-100px;left:-100px}
.auth::after{width:500px;height:500px;background:#F472B6;bottom:-150px;right:-150px}
.auth-card{background:var(--surface);border-radius:28px;padding:36px 32px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);position:relative;z-index:1}
.auth-card h1{margin:0 0 6px;font-size:26px;font-weight:700;letter-spacing:-.03em}
.auth-card p.lead{margin:0 0 22px;color:var(--text-2);font-size:14.5px}
.auth-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tabs button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--text-2)}
.auth-tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.auth-card .hint{font-size:12.5px;color:var(--text-3);margin-top:12px;text-align:center}
.auth-demo{margin-top:18px;padding-top:18px;border-top:1px dashed var(--border);text-align:center}
.auth-demo button{color:var(--brand);font-weight:600;font-size:13.5px}

.wizard-card{background:var(--surface);border-radius:24px;padding:36px 32px;max-width:560px;width:100%;box-shadow:var(--shadow-lg)}
.wizard-steps{display:flex;gap:6px;margin-bottom:22px}
.wizard-steps i{flex:1;height:4px;background:var(--border);border-radius:4px}
.wizard-steps i.done{background:var(--brand)}
.wizard-steps i.active{background:var(--brand-2)}
.wizard h2{margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.wizard p.lead{margin:0 0 22px;color:var(--text-2);font-size:14px}
.empty{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty .icon{font-size:40px;margin-bottom:10px;opacity:.5}
.empty h4{margin:0 0 6px;color:var(--text);font-size:15px}
.empty p{margin:0 0 16px;font-size:13px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mb-16{margin-bottom:16px}.mb-12{margin-bottom:12px}.mb-8{margin-bottom:8px}
.tx-summary-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.tx-summary-info{flex:1;min-width:0;min-width:180px}

  .tx-summary-actions{width:100%;justify-content:stretch}

  .tx-summary-badges{gap:4px}

}

.badge.pos{background:var(--pos-soft);color:var(--pos-text)}
.badge.neg{background:var(--neg-soft);color:var(--neg-text)}
